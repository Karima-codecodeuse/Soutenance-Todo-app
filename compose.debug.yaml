services:
  todofrontend:
    image: todofrontend
    build:
      context: TP-Todo-List-main (2)/TP-Todo-List-main/todo-frontend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command: ["node", "--inspect=0.0.0.0:9229", "index.js"]
